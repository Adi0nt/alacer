# Alacer configuration. Any option can be overridden per launch with -Dalacer.<key>=<value>.

# Cloud layer height offset in blocks (-64 to 128). Zero preserves the dimension's height. Default: 0
quality.cloudHeight=0

# Sky pass: 0 Off (including sun, moon and stars), 1 On. Clouds remain separate. Default: 1
quality.sky=1

# Star brightness, 0-200 percent. Requires Sky and Stars enabled. Default: 100
quality.starBrightness=100

# Rain/snow geometry opacity, 0-100 percent. Does not change rain sounds or splash particles. Default: 100
quality.weatherOpacity=100

# Leaves quality: 0 follows Graphics, 1 Fast, 2 Fancy. Default: 0
quality.leaves=0

# Weather geometry: 0 follows Graphics, 1 Fast, 2 Fancy, 3 Off. Rain sounds and splash particles remain. Default: 0
quality.weather=0

# Rain splash particles: 0 follows Graphics, 1 Fast (about a quarter as many), 2 Fancy, 3 Off. Rain sounds remain. Default: 0
quality.rainSplashes=0

# HUD vignette: 0 follows Graphics, 1 Off, 2 On. Default: 0
quality.vignette=0

# Night-sky stars: 0 Off, 1 On. Default: 1
quality.stars=1

# Enchantment glint on items and armor: 0 Off, 1 On. Default: 1
quality.enchantGlint=1

# Dropped item stacks: 0 Fast (one model per stack), 1 Fancy (up to five models by stack size). Default: 1
quality.droppedItems=1

# Smooth-lighting style: 0 Vanilla, 1 Soft. Requires smooth lighting; rebuild terrain after changes. Default: 0
quality.lightingStyle=0

# Ambient-occlusion corner darkness, 0-100 percent. Does not change sky/block light or directional shading. Default: 100
quality.aoStrength=100

# Entity draw distance, 25-500 percent of vanilla's (multiples of 25). Entities still need visible terrain. Default: 100
quality.entityDistance=100

# Block entity (chests, signs, banners, heads) draw distance, 25-500 percent of vanilla's (multiples of 25). Default: 100
quality.blockEntityDistance=100

# Overworld distance fog start, 10-95 percent of the render distance (multiples of 5), or 100 for no distance fog. Blindness, water, lava and Nether fog are unchanged. Default: 75
quality.fogStart=75

# Sun and moon: 0 Off, 1 On. Default: 1
quality.sunMoon=1

# Water texture animation: 0 Off (frozen frame), 1 On. Default: 1
quality.waterAnimation=1

# Lava texture animation: 0 Off (frozen frame), 1 On. Default: 1
quality.lavaAnimation=1

# Fire texture animation: 0 Off (frozen frame), 1 On. Default: 1
quality.fireAnimation=1

# Nether portal texture animation: 0 Off (frozen frame), 1 On. Default: 1
quality.portalAnimation=1

# Other block and item texture animations (clocks and compasses always update): 0 Off, 1 On. Default: 1
quality.otherAnimations=1

# Particles kept per particle list before the oldest is removed: 0=250, 1=500, 2=1000, 3=2000, 4=4000 (vanilla). Default: 4
quality.particleLimit=4

# Biome color blending: 0 Off (1x1), 1 3x3 (vanilla), 2 5x5, 3 7x7. Rebuild terrain after changes. Default: 1
quality.biomeBlend=1

# Anisotropic filtering for block and item textures: 0 Off, 1=2x, 2=4x, 3=8x, 4=16x (limited by the driver). Default: 0
quality.anisotropicFiltering=0

# Mipmap minification filter: 0 Bilinear, 1 Trilinear. Default: 0
quality.mipmapFiltering=0

# Mipmap level-of-detail bias, -100 to 100 percent in steps of 25. Negative sharpens, positive softens. Default: 0
quality.lodBias=0

# Cutout mipmap blending: 0 Vanilla, 1 Preserved (preserves edge colors and coverage). Default: 0
quality.mipmapCutouts=0

# Field-of-view changes from sprinting, flying, speed effects and bows, 0-100 percent (multiples of 5). Default: 100
quality.fovEffects=100

# Camera tilt when taking damage, 0-100 percent (multiples of 5). Default: 100
quality.damageTilt=100

# View-bobbing strength while View bobbing is on, 0-100 percent (multiples of 5). Default: 100
quality.viewBobbing=100

# Nausea and Nether portal view distortion, 0-100 percent (multiples of 5). Default: 100
quality.distortion=100

# Third-person camera distance, 1-16 blocks (vanilla 4). Default: 4
quality.thirdPersonDistance=4

# Third-person camera stops in front of blocks: 0 Off, 1 On (vanilla). Default: 1
quality.cameraCollision=1

# Field-of-view transitions: 0 Instant, 1 Vanilla, 2 Smooth, 3 Very smooth. Default: 1
quality.fovTransition=1

# Zoom key magnification: 0=2x, 1=3x, 2=4x, 3=6x, 4=8x. The key is unbound by default. Default: 2
quality.zoom=2

# Client-thread time for chunk uploads and rebuild scheduling: 0=25%, 1=50%, 2=100% (vanilla), 3=200%, 4=400% of vanilla's budget. Default: 2
advanced.chunkUpdateBudget=2

# Chunk builder threads, 1-6 (vanilla 2). Read at startup. Default: 2
advanced.chunkThreads=2

# Collect frame-time, tick-time and memory statistics. Default: true
profiler.enabled=true

# Frames kept in the profiler history (bounded memory). Default: 8192
profiler.history=8192

# Seconds between performance summaries in the log (0 = off). Default: 0
profiler.logInterval=0

# Time individual calls inside entity rendering. Adds measurable overhead; for profiling only. Default: false
profiler.entityDetail=false

# With entityDetail, time model setup/animation/drawing, layers, overlays, name tags and shadows. Disable to measure the extra timers' overhead. Default: true
profiler.entityStages=true

# Time entity shadow rendering as one section and count shadows drawn (two nanoTime calls per shadow). Default: false
profiler.shadowTiming=false

# After each chunk visibility search, repeat its frustum tests through vanilla's test and Alacer's, timing each. Adds frame time; for attribution only. Default: false
profiler.frustumTiming=false

# Attribute chunk build, queue, buffer wait and GL upload wall times. Intrusive; startup only, not performance selection. Default: false
profiler.chunkDetail=false

# Measure how long each visible chunk update waits from the frame it is found dirty and visible until its rebuild is published, and count never-built chunks in view. Startup only; attribution. Default: false
profiler.chunkLatency=false

# Time particle updates, their movement, dead-particle removal and light queries individually. Intrusive; startup only, not performance selection. Default: false
profiler.particleDetail=false

# Count particle light queries and their distinct positions in each particle render pass. Startup only; attribution, not performance selection. Default: false
profiler.particleLightRepeats=false

# Show the performance overlay at startup. Default: false
profiler.hud=false

# Show the performance area graph at startup. Default: false
profiler.graph=false

# Selected graph mode: 0 = Frame Time, 1 = Subsystem Time (ms), 2 = % Split, 3 = Top Subsystem Detail. Default: 1
profiler.graphMode=1

# Replace the per-frame chunk visibility search with an allocation-free equivalent. Default: true
render.fastChunkVisibility=true

# Debug: run vanilla and Alacer visibility searches side by side and log differences. Slower. Default: false
render.fastChunkVisibility.verify=false

# Vectorized block state unpacking and linear block counter scan during chunk packet handling. Default: true
render.fastChunkUnpack=true

# Debug: compare fast chunk unpacking and block counters with vanilla's scalar logic. Default: false
render.fastChunkUnpack.verify=false

# Experimental: test chunk boxes at one corner per frustum plane (same decisions as vanilla). No dependable measured performance gain; off by default. Default: false
render.fastChunkFrustum=false

# Debug: also run vanilla's frustum test for every chunk box, use its answer and log any difference. Default: false
render.fastChunkFrustum.verify=false

# Experimental: in Alacer's chunk search, find the camera section's open faces with an allocation-free flood fill, and reuse the answer while the camera stays in the same connected pocket of an unchanged section (same faces as vanilla). Not yet measured; off by default. Default: false
render.fastCameraSectionFaces=false

# Debug: also run vanilla's camera-section flood fill for every answer, use its result and log any difference. Use with the Alacer chunk search enabled. Default: false
render.fastCameraSectionFaces.verify=false

# Reuse each render chunk's world-chunk reference when gathering entities instead of a hash lookup per chunk per frame. Default: true
render.fastEntityChunkLookup=true

# Debug: also do vanilla's lookup for every cached one and log differences. Default: false
render.fastEntityChunkLookup.verify=false

# High-performance entity pipeline override: skips empty chunk sections during entity and block entity loops while preserving exact vanilla rendering order and behavior. Default: true
render.fastEntityPipeline=true

# Debug: also run vanilla entity traversal and verify matching rendered counts and entities. Default: false
render.fastEntityPipeline.verify=false

# Experimental direct terrain layer submission and layer filtering. Off after qualification found layer-count verifier differences. Default: false
render.fastTerrainPipeline=false

# Debug: compare fast terrain layer rendered chunk counts with vanilla. Default: false
render.fastTerrainPipeline.verify=false

# Check for OpenGL errors about once per second instead of twice per frame. Errors are still reported, with a less precise location. Default: true
render.throttleGlErrorChecks=true

# Debug: deliberately raise a harmless OpenGL error between checks and log whether it is reported. Default: false
render.throttleGlErrorChecks.verify=false

# Compute the camera, frustum and render chunk matrices on the CPU instead of reading them back from OpenGL every frame. Default: true
render.avoidMatrixReads=true

# Debug: also read the matrices from OpenGL, use those, and log any difference. Default: false
render.avoidMatrixReads.verify=false

# Skip the translations by zero that every entity model part issues twice (about 20% of the OpenGL calls of drawing entities). Default: false
render.skipZeroTranslates=false

# Debug: issue the translations anyway and check about once per second that they leave OpenGL's matrix unchanged. Default: false
render.skipZeroTranslates.verify=false

# Compile fancy cloud geometry into a display list, rebuilt only when its shape changes, instead of rebuilding about 10,000 vertices every frame. Default: true
render.cacheClouds=true

# Debug: draw vanilla's clouds and compare every vertex with the cached geometry, logging differences. Default: false
render.cacheClouds.verify=false

# Answer entity shadows' block and light queries from cached chunk references instead of a chunk hash lookup per query. Default: true
render.fastEntityShadows=true

# Debug: also run vanilla's shadow queries, use their results and log any difference. Default: false
render.fastEntityShadows.verify=false

# Answer entity light and brightness queries without BlockPos allocations or chunk hash lookups. Default: true
render.fastEntityLighting=true

# Debug: also run vanilla's entity light queries, use their results and log any difference. Default: false
render.fastEntityLighting.verify=false

# Cache entity renderer lookups to eliminate repeated map searches in entity rendering. Default: true
render.fastEntityRendererLookup=true

# Debug: also run vanilla's renderer map query, use its result and log any difference. Default: false
render.fastEntityRendererLookup.verify=false

# Evaluate entity distance and frustum before entity state preparation and renderer invocation. Default: true
render.fastEntityCulling=true

# Debug: also run vanilla's shouldRender check, use its result and log any difference. Default: false
render.fastEntityCulling.verify=false

# Trace crosshair and entity rays without intermediate Vec3d or BlockPos allocations. Default: true
render.fastRayTrace=true

# Debug: also run vanilla's ray trace, use its result and log any difference. Default: false
render.fastRayTrace.verify=false

# Reduce client ambient tick position and lookup allocations, preserving vanilla per-tick Random lifetime. Default: true
render.fastRandomDisplayTicks=true

# Debug: also verify fast display tick block queries against vanilla, logging differences. Default: false
render.fastRandomDisplayTicks.verify=false

# Wake paulscode sound threads via lock-free parking instead of Thread.sleep and thread interruption. Default: true
render.fastSoundThread=true

# Debug: verify sound thread wake timing, lifecycle and interruption handling against expected bounds. Default: false
render.fastSoundThread.verify=false

# Experimental exact-input visibility reuse. Off pending diagnosis of traversal verifier differences. Default: false
render.cameraHysteresis=false

# Debug: compare retained visibility against a fresh vanilla search and use vanilla's result. Default: false
render.cameraHysteresis.verify=false

# Experimental packed section connectivity bitmask. Off after qualification found native verifier differences. Default: false
render.flatOcclusion=false

# Debug: also test chunk occlusion via vanilla CompiledChunk.isVisible and log differences. Default: false
render.flatOcclusion.verify=false

# Vectorized frustum testing of chunk bounding boxes against the 6 frustum planes. Default: true
render.vectorFrustum=true

# Debug: also run vanilla frustum culler and log differences. Default: false
render.vectorFrustum.verify=false

# Experimental worker block-state and lighting cache. Off after qualification failed frame-tail and CPU gates. Default: false
render.fastWorkerAo=false

# Debug: also verify worker block state queries against vanilla chunk lookups. Default: false
render.fastWorkerAo.verify=false

# Experimental zero-translation skipping in model parts. Off after qualification failed static p99 and CPU gates; no hierarchy flattening or push/pop removal. Default: false
render.fastModelTransforms=false

# Debug: retain vanilla translations and sample raw matrix bits before/after zero translations. Default: false
render.fastModelTransforms.verify=false

# Answer particles' per-frame light queries from cached chunk references instead of chunk hash lookups, without allocating neighbor positions. Default: true
render.fastParticleLight=true

# Debug: also run vanilla's particle light query, use its result and log any difference. Default: false
render.fastParticleLight.verify=false

# Fast LUT-based gamma mipmap generation and parallel sprite downsampling. Default: true
render.fastMipmaps=true

# Debug: compare fast mipmap results against vanilla downsampling and log differences. Default: false
render.fastMipmaps.verify=false

# Remove dead particles each tick in one pass by network id instead of comparing every live particle with every dead one (same particles, order and list). Default: true
render.fastParticleRemoval=true

# Debug: also run vanilla's dead-particle removal, use its result and log any difference. Default: false
render.fastParticleRemoval.verify=false

# Write each particle vertex's position, texture, color and light bytes directly at their fixed offsets instead of through BufferBuilder's per-element format lookups (same bytes). Its hooks are installed only when on at startup (or verified, or benchmark-toggled). Default: true
render.fastParticleVertices=true

# Debug: let vanilla write particle vertices, compare the direct writes' bytes with them and log any difference. Default: false
render.fastParticleVertices.verify=false

# Answer the loaded-chunk check before each particle's light query with vanilla's client-world range test, and reuse one position instead of copying it when the light query is answered by render.fastParticleLight (same results). Its hooks are installed only when on at startup (or verified, or benchmark-toggled). Default: false
render.fastParticleLightEntry=false

# Debug: keep vanilla's position copy, also run vanilla's chunk check, use its result and log any difference. Default: false
render.fastParticleLightEntry.verify=false

# Within one particle render pass, answer render.fastParticleLight's light queries for a block position already answered in that pass from that answer (the client world cannot change during the pass; same results). Its hooks are installed only when on at startup (or verified, or benchmark-toggled). Default: false
render.reuseParticleLight=false

# Debug: also run vanilla's light query for every reused or computed answer, use its result and log any difference. Default: false
render.reuseParticleLight.verify=false

# Experimental: read particle movement block states through cached chunk references. Off until measured and verified. Default: false
render.fastParticleMovement=false

# Debug: compare cached-chunk movement block states with vanilla and use vanilla's state. Default: false
render.fastParticleMovement.verify=false

# Experimental: reuse immutable zero-offset particle movement boxes with bit-exact safe coordinates. Off by default. Default: false
render.reuseParticleBoxes=false

# Debug: compare particle movement Box coordinates against vanilla using raw double bits. Default: false
render.reuseParticleBoxes.verify=false

# Experimental: scalar particle collision nearby-entity query bounds. Off by default. Default: false
render.scalarParticleEntityQuery=false

# Debug: compare scalar bounds and ordered entity query results with vanilla. Default: false
render.scalarParticleEntityQuery.verify=false

# Experimental: pass one reused position instead of a new BlockPos to each entity shadow's block-below query (same query and answer). Off by default; its hook is installed only when on at startup (or verified, or benchmark-toggled). Default: false
render.reuseShadowPositions=false

# Debug: keep vanilla's new position, compare the reused one's coordinates and the block state answered for each, and log any difference. Default: false
render.reuseShadowPositions.verify=false

# Modern OpenGL rendering pipeline (TerrainShader, VAO attribute binding, and precomputed chunk adjacency). Default: false
render.modernPipeline=false

# Experimental exact precomputed chunk storage adjacency; avoids per-edge integer division. Default: false
render.fastChunkNeighbours=false

# Compare every adjacency result with the original slot math and use the original result. Default: false
render.fastChunkNeighbours.verify=false

# Experimental terrain vertex shader pipeline; off pending native visual and performance qualification. Startup hooks. Default: false
render.terrainShader=false

# Legacy alias for render.terrainShader. Default: false
render.terrainVaos=false

# Experimental OpenGL 4.5 named VBO creation/uploads; startup hooks, preserves vanilla buffer bytes and final unbind. Default: false
render.directBufferUploads=false

# Intrusive: validate terrain VAO state and read back every named VBO upload byte. Enables both GL experiments when supported. Default: false
render.modernGl.verify=false

# Experimental OpenGL 4.3 Multi-Draw Indirect submission over shared resident mesh storage. Default: false
render.multiDrawIndirect=false

# Debug: validate indirect draw command structs, quads, and origin records against reference direct draws. Default: false
render.multiDrawIndirect.verify=false

# Experimental: after Minecraft's per-frame chunk deadline stops queueing rebuilds, keep queueing visible dirty chunks (same order and calls) until the builder threads have about one frame of work. Uploads keep Minecraft's deadline. Off by default. Default: false
render.feedChunkWorkers=false

# Experimental: when Minecraft's per-frame chunk deadline leaves less than 1/32 of the previous frame's time (at most 4.2 ms), allow that much for uploading built chunks and queueing rebuilds. Off by default. Default: false
render.chunkTimeFloor=false

# Combine vanilla model-part face uploads in an alternate display list; experimental, off by default. Default: false
render.batchModelLists=false

# Debug: compare native OpenGL feedback from vanilla and batched model lists at compilation. Default: false
render.batchModelLists.verify=false

# Experimental: high-precision frame limiter and pacer using LockSupport.parkNanos and Thread.onSpinWait, with GPU timer-query margins. Not yet qualified against vanilla's Display.sync; off by default. Default: false
render.fastDisplaySync=false

# Debug: verify frame limiter sleep durations and pacing error bounds. Default: false
render.fastDisplaySync.verify=false

# Experimental: early 3D pipeline flush to overlap CPU HUD/GUI rendering with GPU draw execution. Not yet qualified; off by default. Default: false
render.fastSwapBuffers=false

# Debug: verify pipeline flush execution and fence status. Default: false
render.fastSwapBuffers.verify=false

# Experimental: skip vanilla's unconditional client-thread yield after the buffer swap. Not yet qualified; off by default. Default: false
render.suppressThreadYield=false
